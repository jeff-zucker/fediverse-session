# The library and its demo, served by GitHub Pages at
# https://jeff-zucker.github.io/fediverse-session/ — the demo as the front
# page, the three modules beside it so the page imports them as it does in the
# repo, and FediPod's design tokens, which the demo's stylesheet link names.
name: pages
on:
  push:
    branches: [main]
    paths: ['*.mjs', 'demo.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        run: |
          mkdir -p site
          cp fedi-account.mjs fedi-login.mjs oidc-session.mjs site/
          cp demo.html site/index.html
          curl -fsSL https://raw.githubusercontent.com/jeff-zucker/FediPod/main/web/admin/tokens.css -o site/tokens.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
